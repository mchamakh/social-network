services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/social_database?sslmode=disable
      ACCESS_SECRET: mysupersecretaccesstoken
      REFRESH_SECRET: mysupersecretrefreshtoken
      GIN_MODE: release
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
